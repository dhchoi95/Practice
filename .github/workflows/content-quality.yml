name: Content quality
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'content-review/**'
      - 'package*.json'
      - '.github/workflows/content-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run content:preview
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-evaluation
          path: |
            reports/content-improvement-1.4.0/
            reports/integrated-2.0.0/
            reports/foundation-2.1.0/
            reports/final-2.3.0/
            reports/content-inventory.json
            reports/content-coverage.json
            reports/content-preview.json
          retention-days: 14
